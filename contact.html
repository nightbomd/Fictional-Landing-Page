<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Contact Us</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <img src="download.png" id="sunflower" alt="sunflower">

    <header>
        <nav id="navbar" class="navbar navbar-expand-lg d-flex align-items-center">
            <div class="container-fluid">

                <img class="logo-img img-fluid"
                    src="./Client Files/Client Files/Logos/logo-main-full-color.png"
                    alt="Logo">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Activities</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="products.html">Products</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Seasonal Highlights</a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <section class="contact-section container observe" data-animation="fadeUp">

            <div class="text-center">

                <img src="./Client Files/Client Files/Logos/logo-icon-sun-creek.png"
                    class="contact-logo mb-3"
                    alt="Farm Logo">

                <h1 class="subheading fw-bold contact-title">
                    Contact Us
                </h1>

            </div>

            <form class="contact-form">

                <div class="row">

                    <div class="col-md-6 mb-4">
                        <label class="form-label">
                            First Name*
                        </label>

                        <input type="text"
                            class="form-control contact-input"
                            required>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="form-label">
                            Last Name*
                        </label>

                        <input type="text"
                            class="form-control contact-input"
                            required>
                    </div>

                </div>

                <div class="mb-4">
                    <label class="form-label">
                        Email*
                    </label>

                    <input type="email"
                        class="form-control contact-input"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        Message
                    </label>

                    <textarea
                        class="form-control contact-input"
                        rows="7"></textarea>
                </div>

                <button type="submit"
                    class="btn btn-primary w-100 py-3">
                    Submit
                </button>

            </form>

        </section>

    </main>

    <footer>
        <div class="bg-green m-0">
            <p class="text-center text-white py-3 mb-0">
                © 2023 Hollow Creek Farms. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>

</body>

</html>
